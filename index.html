<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>artha by Manomay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Source+Sans+Pro:wght@400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:   #F5F5EF;
      --text: #0E0E0E;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      cursor: crosshair;
    }

    /* ── brand name ── */
    .brand {
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(14,14,14,0.55);
      user-select: none;
    }

    /* ── main text ── */
    .glitch-wrap {
      position: relative;
      display: inline-block;
      user-select: none;
    }

    .glitch-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(48px, 10vw, 128px);
      font-weight: 700;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    /* pseudo-element glitch layers */
    .glitch-text::before,
    .glitch-text::after {
      content: attr(data-text);
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      line-height: inherit;
      opacity: 0;
      pointer-events: none;
    }

    .glitch-text::before {
      color: #c00;
      z-index: -1;
    }

    .glitch-text::after {
      color: #00c;
      z-index: -2;
    }

    /* active glitch state — toggled by JS */
    .glitch-text.is-glitching::before {
      animation: glitch-r 0.18s steps(1) forwards;
    }

    .glitch-text.is-glitching::after {
      animation: glitch-b 0.18s steps(1) forwards;
    }

    .glitch-text.is-glitching {
      animation: glitch-main 0.18s steps(1) forwards;
    }

    @keyframes glitch-main {
      0%   { clip-path: inset(0 0 85% 0); transform: translate(-2px, 0); }
      10%  { clip-path: inset(20% 0 60% 0); transform: translate(2px, 0); }
      20%  { clip-path: inset(50% 0 30% 0); transform: translate(-1px, 0); }
      30%  { clip-path: inset(70% 0 5% 0);  transform: translate(3px, 0); }
      40%  { clip-path: inset(0 0 0 0);     transform: translate(0, 0); }
      50%  { clip-path: inset(30% 0 55% 0); transform: translate(-3px, 0); }
      60%  { clip-path: inset(10% 0 75% 0); transform: translate(1px, 0); }
      70%  { clip-path: inset(60% 0 20% 0); transform: translate(-2px, 0); }
      80%  { clip-path: inset(0 0 0 0);     transform: translate(0, 0); }
      90%  { clip-path: inset(45% 0 40% 0); transform: translate(2px, 0); }
      100% { clip-path: inset(0 0 0 0);     transform: translate(0, 0); opacity: 1; }
    }

    @keyframes glitch-r {
      0%   { opacity: 0.7; transform: translate(4px, -2px);  clip-path: inset(10% 0 70% 0); }
      15%  { opacity: 0.5; transform: translate(-3px, 1px);  clip-path: inset(60% 0 15% 0); }
      30%  { opacity: 0.8; transform: translate(2px, 3px);   clip-path: inset(30% 0 45% 0); }
      45%  { opacity: 0;   transform: translate(0, 0);       }
      60%  { opacity: 0.6; transform: translate(-4px, -1px); clip-path: inset(75% 0 5% 0);  }
      75%  { opacity: 0.4; transform: translate(3px, 2px);   clip-path: inset(5% 0 80% 0);  }
      90%  { opacity: 0.7; transform: translate(-2px, -3px); clip-path: inset(50% 0 25% 0); }
      100% { opacity: 0;   transform: translate(0, 0);       }
    }

    @keyframes glitch-b {
      0%   { opacity: 0.6; transform: translate(-4px, 2px);  clip-path: inset(50% 0 20% 0); }
      20%  { opacity: 0.8; transform: translate(3px, -1px);  clip-path: inset(10% 0 65% 0); }
      40%  { opacity: 0.5; transform: translate(-2px, 3px);  clip-path: inset(75% 0 5% 0);  }
      60%  { opacity: 0;   transform: translate(0, 0);       }
      70%  { opacity: 0.7; transform: translate(4px, -2px);  clip-path: inset(25% 0 50% 0); }
      85%  { opacity: 0.4; transform: translate(-3px, 1px);  clip-path: inset(60% 0 15% 0); }
      100% { opacity: 0;   transform: translate(0, 0);       }
    }

    /* scanline overlay — subtle, always present */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(14,14,14,0.025) 2px,
        rgba(14,14,14,0.025) 4px
      );
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <p class="brand">artha by Manomay</p>

  <div class="glitch-wrap">
    <span class="glitch-text" id="gt" data-text="Under Construction">Under Construction</span>
  </div>

<script>
  var el = document.getElementById('gt');
  var glitching = false;

  function triggerGlitch(duration) {
    if (glitching) return;
    glitching = true;
    el.classList.add('is-glitching');

    setTimeout(function() {
      el.classList.remove('is-glitching');

      // short pause then allow another
      setTimeout(function() {
        glitching = false;
      }, 80);
    }, duration || 180);
  }

  // random interval glitch
  function scheduleRandom() {
    // fire between every 1.5s and 7s
    var delay = 1500 + Math.random() * 5500;
    setTimeout(function() {
      // sometimes do a quick burst of 2-3
      var bursts = Math.random() < 0.3 ? Math.floor(Math.random() * 3) + 2 : 1;
      for (var b = 0; b < bursts; b++) {
        (function(i) {
          setTimeout(function() {
            triggerGlitch(120 + Math.random() * 100);
          }, i * 220);
        })(b);
      }
      scheduleRandom();
    }, delay);
  }

  scheduleRandom();

  // hover glitch
  document.querySelector('.glitch-wrap').addEventListener('mouseenter', function() {
    triggerGlitch(200);
  });

  document.querySelector('.glitch-wrap').addEventListener('mousemove', function() {
    if (!glitching && Math.random() < 0.15) {
      triggerGlitch(120);
    }
  });
</script>
</body>
</html>
